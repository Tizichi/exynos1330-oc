name: Build LKM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git clang llvm lld python3
    - name: Build
      run: |
        cat << 'EOF' > $GITHUB_WORKSPACE/exynos_oc.c
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/init.h>

        static unsigned long pkbdev_addr = 0xffffffc001d03a18UL;
        static unsigned int target_gpu_khz = 1053000;

        static int __init exynos_oc_init(void) {
            void **pkbdev_ptr = (void **)pkbdev_addr;
            unsigned char *base;
            size_t i;
            int patched = 0;

            if (!pkbdev_ptr || !(*pkbdev_ptr)) {
                pr_err("exynos_oc: pkbdev null!\n");
                return -EFAULT;
            }

            base = (unsigned char *)(*pkbdev_ptr);
            for (i = 0; i < 65536 - 16; i += 4) {
                u32 *p = (u32 *)(base + i);
                if (*(p + 0) == 949000 && *(p + 1) == 78 && *(p + 2) == 95) {
                    pr_info("exynos_oc: Patching gpu_dvfs_table +0x%zx (949000 -> %u kHz)\n", i, target_gpu_khz);
                    *(p + 0) = target_gpu_khz;
                    patched++;
                }
            }
            pr_info("exynos_oc: Patched %d entries in RAM!\n", patched);
            return 0;
        }

        static void __exit exynos_oc_exit(void) {
            pr_info("exynos_oc: Unloaded\n");
        }

        module_init(exynos_oc_init);
        module_exit(exynos_oc_exit);
        MODULE_LICENSE("GPL");
        MODULE_AUTHOR("HardwareEngineer");
        MODULE_DESCRIPTION("Exynos 1330 GPU Overclock LKM");
        EOF

        echo "obj-m := exynos_oc.o" > $GITHUB_WORKSPACE/Makefile
        H="android"
        D="googlesource.com"
        git clone --depth=1 -b android13-5.15-lts "https://${H}.${D}/kernel/common" kernel_src
        cd kernel_src
        sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 197/" Makefile
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          -e CONFIG_MODULES -e CONFIG_MODVERSIONS -e CONFIG_LTO_NONE \
          -d CONFIG_MODULE_SIG -d CONFIG_LTO_CLANG_FULL -d CONFIG_LTO_CLANG_THIN -d CONFIG_CFI_CLANG -d CONFIG_DEBUG_INFO_BTF \
          --set-str CONFIG_LOCALVERSION "-android13-3-34492332"
        make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig modules_prepare
        printf "0x0222dd63\tmodule_layout\tvmlinux\tEXPORT_SYMBOL\t\n0x92997ed8\t_printk\tvmlinux\tEXPORT_SYMBOL\t\n" > Module.symvers
        make -C $GITHUB_WORKSPACE/kernel_src M=$GITHUB_WORKSPACE ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" modules
        modinfo $GITHUB_WORKSPACE/exynos_oc.ko
    - uses: actions/upload-artifact@v4
      with:
        name: exynos_oc_lkm
        path: exynos_oc.ko
