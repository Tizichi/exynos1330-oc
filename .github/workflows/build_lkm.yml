name: Build LKM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git clang llvm lld python3
    - name: Build
      run: |
        cat << 'EOF' > $GITHUB_WORKSPACE/exynos_oc.c
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/init.h>

        static unsigned long pkbdev_addr = 0xffffffc001da2a18UL;
        static unsigned int target_gpu_khz = 1053000;

        static bool is_safe_kptr(unsigned long addr) {
            /* Kiem tra dia chi thuoc vung kernel linear map (0xffffff80...) va chia het cho 8 */
            return (addr >= 0xffffff8000000000UL && addr < 0xffffffc000000000UL && (addr & 0x7) == 0);
        }

        static int scan_and_patch(unsigned char *buf, size_t max_len, const char *tag) {
            size_t i;
            int count = 0;
            for (i = 0; i <= max_len - 16; i += 4) {
                u32 *p = (u32 *)(buf + i);
                if (*(p + 0) == 949000 && *(p + 1) == 78 && *(p + 2) == 95) {
                    pr_info("exynos_oc: [%s +0x%zx] Patching 949000 -> %u kHz\n", tag, i, target_gpu_khz);
                    *(p + 0) = target_gpu_khz;
                    count++;
                }
            }
            return count;
        }

        static int __init exynos_oc_init(void) {
            unsigned long *pkbdev_slot = (unsigned long *)pkbdev_addr;
            unsigned long kbdev_val;
            unsigned long *ptr_array;
            size_t idx;
            int total = 0;

            kbdev_val = *pkbdev_slot;
            pr_info("exynos_oc: pkbdev = 0x%lx\n", kbdev_val);

            if (!is_safe_kptr(kbdev_val)) {
                pr_err("exynos_oc: Dia chi kbdev khong hop le!\n");
                return -EFAULT;
            }

            /* 1. Quet an toan 4KB dau tien cua kbase_device */
            total += scan_and_patch((unsigned char *)kbdev_val, 4096, "kbdev");

            /* 2. Quet cac con tro con (platform_context / table) trong 4KB dau tien */
            ptr_array = (unsigned long *)kbdev_val;
            for (idx = 0; idx < 512; idx++) {
                unsigned long sub_ptr = ptr_array[idx];
                if (is_safe_kptr(sub_ptr)) {
                    total += scan_and_patch((unsigned char *)sub_ptr, 2048, "sub_ctx");
                }
            }

            pr_info("exynos_oc: Hoan tat! Da va tong cong %d vi tri trong RAM.\n", total);
            return 0;
        }

        static void __exit exynos_oc_exit(void) {
            pr_info("exynos_oc: Unloaded\n");
        }

        module_init(exynos_oc_init);
        module_exit(exynos_oc_exit);
        MODULE_LICENSE("GPL");
        MODULE_AUTHOR("HardwareEngineer");
        MODULE_DESCRIPTION("Exynos 1330 Safe GPU Overclock LKM");
        EOF

        echo "obj-m := exynos_oc.o" > $GITHUB_WORKSPACE/Makefile
        H="android"
        D="googlesource.com"
        git clone --depth=1 -b android13-5.15-lts "https://${H}.${D}/kernel/common" kernel_src
        cd kernel_src
        sed -i "s/^SUBLEVEL = .*/SUBLEVEL = 197/" Makefile
        ./scripts/config --file arch/arm64/configs/gki_defconfig \
          -e CONFIG_MODULES -e CONFIG_MODVERSIONS -e CONFIG_LTO_NONE \
          -d CONFIG_MODULE_SIG -d CONFIG_LTO_CLANG_FULL -d CONFIG_LTO_CLANG_THIN -d CONFIG_CFI_CLANG -d CONFIG_DEBUG_INFO_BTF \
          --set-str CONFIG_LOCALVERSION "-android13-3-34492332"
        make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig modules_prepare
        printf "0x0222dd63\tmodule_layout\tvmlinux\tEXPORT_SYMBOL\t\n0x92997ed8\t_printk\tvmlinux\tEXPORT_SYMBOL\t\n" > Module.symvers
        make -C $GITHUB_WORKSPACE/kernel_src M=$GITHUB_WORKSPACE ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" modules
        modinfo $GITHUB_WORKSPACE/exynos_oc.ko
    - uses: actions/upload-artifact@v4
      with:
        name: exynos_oc_lkm
        path: exynos_oc.ko
